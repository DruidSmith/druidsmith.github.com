<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post editor | David G. Smith</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { background: #f7f5f0; } .serif { font-family: Georgia, serif; }</style>
</head>
<body class="min-h-screen text-slate-900">
<main class="mx-auto max-w-3xl px-5 py-12 sm:py-20">
    <header class="mb-10">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-amber-700">Private editor</p>
        <h1 class="serif text-4xl font-medium">Add a thought</h1>
        <p class="mt-3 max-w-xl text-slate-600">Sign in through the configured private endpoint to save a post to the site.</p>
    </header>

    <section id="login-panel" class="rounded border border-slate-200 bg-white p-6 shadow-sm">
        <form id="login-form" class="space-y-5">
            <label class="block text-sm font-medium" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded border border-slate-300 px-3 py-3 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
            <button class="rounded bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700" type="submit">Sign in</button>
        </form>
    </section>

    <section id="editor-panel" class="hidden rounded border border-slate-200 bg-white p-6 shadow-sm">
        <form id="post-form" class="space-y-5">
            <label class="block text-sm font-medium" for="title">Title<input id="title" name="title" required maxlength="200" class="mt-2 w-full rounded border border-slate-300 px-3 py-3"></label>
            <label class="block text-sm font-medium" for="body">Post body<textarea id="body" name="body" required rows="10" class="mt-2 w-full rounded border border-slate-300 px-3 py-3"></textarea></label>
            <label class="block text-sm font-medium" for="url">Original post URL<input id="url" name="url" type="url" required placeholder="https://www.linkedin.com/..." class="mt-2 w-full rounded border border-slate-300 px-3 py-3"></label>
            <p id="platform-preview" class="text-sm text-slate-500"></p>
            <button class="rounded bg-amber-700 px-5 py-3 text-sm font-semibold text-white hover:bg-amber-800" type="submit">Save post</button>
        </form>
    </section>
    <p id="status" role="status" class="mt-5 text-sm text-slate-600"></p>
</main>
<script>
    window.POSTING_CONFIG = { endpoint: '' };
const config = window.POSTING_CONFIG || { endpoint: '' };
let sessionToken = '';
const status = document.querySelector('#status');
const platformPreview = document.querySelector('#platform-preview');

function setStatus(message, isError = false) {
    status.textContent = message;
    status.className = `mt-5 text-sm ${isError ? 'text-red-700' : 'text-slate-600'}`;
}

function platformFromUrl(value) {
    try {
        const host = new URL(value).hostname.replace(/^www\./, '');
        if (host.includes('linkedin')) return 'LinkedIn';
        if (host === 'x.com' || host === 'twitter.com') return 'X / Twitter';
        return ['facebook', 'instagram', 'youtube', 'tiktok', 'threads', 'medium', 'github'].find(name => host.includes(name)) || 'Other';
    } catch { return ''; }
}

document.querySelector('#url').addEventListener('input', event => {
    const platform = platformFromUrl(event.target.value);
    platformPreview.textContent = platform ? `Platform detected: ${platform}` : '';
});

async function send(path, payload, token = '') {
    if (!config.endpoint) throw new Error('POSTING_CONFIG.endpoint is not configured.');
    const response = await fetch(`${config.endpoint.replace(/\/$/, '')}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) }, body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error((await response.text()) || 'Request failed.');
    return response.json();
}

document.querySelector('#login-form').addEventListener('submit', async event => {
    event.preventDefault(); setStatus('Signing in...');
    try {
        const result = await send('/login', { password: document.querySelector('#password').value });
        sessionToken = result.token;
        document.querySelector('#login-panel').classList.add('hidden');
        document.querySelector('#editor-panel').classList.remove('hidden');
        setStatus('Signed in.');
    } catch (error) { setStatus(error.message, true); }
});

document.querySelector('#post-form').addEventListener('submit', async event => {
    event.preventDefault(); setStatus('Saving...');
    const form = new FormData(event.target);
    try {
        await send('/posts', { title: form.get('title'), body: form.get('body'), url: form.get('url') }, sessionToken);
        event.target.reset(); platformPreview.textContent = ''; setStatus('Saved. GitHub Actions will publish it shortly.');
    } catch (error) { setStatus(error.message, true); }
});
</script>
</body>
</html>
