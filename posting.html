<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Post editor | David G. Smith</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
<style>body { background: #f7f5f0; } .serif { font-family: Georgia, serif; }</style>
</head>
<body class="min-h-screen text-slate-900">
<main class="mx-auto max-w-3xl px-5 py-12 sm:py-20">
    <header class="mb-10">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-amber-700">Private editor</p>
        <h1 class="serif text-4xl font-medium">Add or Edit a thought</h1>
        <p class="mt-3 max-w-xl text-slate-600">Sign in through the configured private endpoint to save a post to the site.</p>
    </header>

    <section id="login-panel" class="rounded border border-slate-200 bg-white p-6 shadow-sm">
        <form id="login-form" class="space-y-5">
            <label class="block text-sm font-medium" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded border border-slate-300 px-3 py-3 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
            <button class="rounded bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700" type="submit">Sign in</button>
        </form>
    </section>

    <section id="editor-panel" class="hidden rounded border border-slate-200 bg-white p-6 shadow-sm">
        <div class="mb-8 p-5 bg-slate-50 border border-slate-200 rounded mb-6">
            <label class="block text-sm font-medium" for="edit-select">Edit an existing post</label>
            <select id="edit-select" class="mt-2 w-full rounded border border-slate-300 px-3 py-2 bg-white outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
                <option value="">-- Create a New Post --</option>
            </select>
        </div>

        <form id="post-form" class="space-y-5">
            <label class="block text-sm font-medium" for="title">Title<input id="title" name="title" required maxlength="200" class="mt-2 w-full rounded border border-slate-300 px-3 py-3"></label>
            <input type="hidden" id="original_date" name="original_date" value="">
            
            <label class="block text-sm font-medium" for="tags">Tags (comma-separated)</label>
            <input list="tag-picklist" id="tags" name="tags" placeholder="e.g., AI, Critical Thinking" class="mt-2 w-full rounded border border-slate-300 px-3 py-3">
            <datalist id="tag-picklist"></datalist>
            <p class="text-xs text-slate-500 -mt-3">Select existing tags or type new ones to add them to the list permanently.</p>

            <label class="block text-sm font-medium mt-5" for="body">Post body</label>
            <textarea id="body" name="body" required rows="12"></textarea>
            <p class="text-xs text-slate-500">Write in Markdown. Use the preview button to check the formatted post before saving.</p>
            
            <label class="block text-sm font-medium mt-5" for="url">Original post URL<input id="url" name="url" type="url" required placeholder="https://www.linkedin.com/..." class="mt-2 w-full rounded border border-slate-300 px-3 py-3"></label>
            <p id="platform-preview" class="text-sm text-slate-500"></p>
            
            <button class="rounded bg-amber-700 px-5 py-3 text-sm font-semibold text-white hover:bg-amber-800" type="submit">Save post</button>
        </form>
    </section>
    <p id="status" role="status" class="mt-5 text-sm text-slate-600"></p>
</main>
<script>
window.POSTING_CONFIG = { endpoint: 'https://page-post.druidsmith.workers.dev' };
const config = window.POSTING_CONFIG || { endpoint: '' };
let sessionToken = '';
let allPosts = []; // Store posts globally for the editor to access

const status = document.querySelector('#status');
const platformPreview = document.querySelector('#platform-preview');
const bodyEditor = new EasyMDE({
    element: document.querySelector('#body'),
    autofocus: false,
    forceSync: true,
    spellChecker: false,
    status: false,
    toolbar: ['bold', 'italic', 'heading', '|', 'quote', 'unordered-list', 'ordered-list', '|', 'link', 'preview', 'side-by-side', 'fullscreen']
});

function setStatus(message, isError = false) {
    status.textContent = message;
    status.className = `mt-5 text-sm ${isError ? 'text-red-700' : 'text-slate-600'}`;
}

// Fetch existing posts to build the tag picklist AND the edit dropdown
async function loadData() {
    try {
        const response = await fetch(`${config.endpoint.replace(/\/$/, '')}/posts`);
        if(response.ok) {
            allPosts = await response.json();
            const tagSet = new Set();
            const select = document.getElementById('edit-select');
            
            // Reset dropdown except for the first option
            select.innerHTML = '<option value="">-- Create a New Post --</option>';

            allPosts.forEach(p => {
                // Collect tags
                if (p.tags && Array.isArray(p.tags)) {
                    p.tags.forEach(t => tagSet.add(t));
                }
                // Add to edit dropdown
                const opt = document.createElement('option');
                opt.value = p.date; // Use the date as the unique ID
                opt.textContent = p.title;
                select.appendChild(opt);
            });

            // Populate tags datalist
            const picklist = document.getElementById('tag-picklist');
            picklist.innerHTML = '';
            tagSet.forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                picklist.appendChild(opt);
            });
        }
    } catch (e) {
        console.warn('Could not load data', e);
    }
}
loadData();

// Handle selecting a post to edit
document.getElementById('edit-select').addEventListener('change', (e) => {
    const date = e.target.value;
    const form = document.getElementById('post-form');
    
    if (!date) {
        // Switch back to New Post mode
        form.reset();
        bodyEditor.value('');
        document.getElementById('original_date').value = '';
        platformPreview.textContent = '';
        return;
    }
    
    // Switch to Edit mode
    const post = allPosts.find(p => p.date === date);
    if (post) {
        document.getElementById('title').value = post.title || '';
        document.getElementById('url').value = post.url || '';
        document.getElementById('tags').value = (post.tags || []).join(', ');
        document.getElementById('original_date').value = post.date;
        bodyEditor.value(post.body || '');

        const platform = platformFromUrl(post.url);
        platformPreview.textContent = platform ? `Platform detected: ${platform}` : '';
    }
});

function platformFromUrl(value) {
    try {
        const host = new URL(value).hostname.replace(/^www\./, '');
        if (host.includes('linkedin')) return 'LinkedIn';
        if (host === 'x.com' || host === 'twitter.com') return 'X / Twitter';
        return ['facebook', 'instagram', 'youtube', 'tiktok', 'threads', 'medium', 'github'].find(name => host.includes(name)) || 'Other';
    } catch { return ''; }
}

document.querySelector('#url').addEventListener('input', event => {
    const platform = platformFromUrl(event.target.value);
    platformPreview.textContent = platform ? `Platform detected: ${platform}` : '';
});

async function send(path, payload, token = '') {
    if (!config.endpoint) throw new Error('POSTING_CONFIG.endpoint is not configured.');
    const response = await fetch(`${config.endpoint.replace(/\/$/, '')}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) }, body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error((await response.text()) || 'Request failed.');
    return response.json();
}

document.querySelector('#login-form').addEventListener('submit', async event => {
    event.preventDefault(); setStatus('Signing in...');
    try {
        const result = await send('/login', { password: document.querySelector('#password').value });
        sessionToken = result.token;
        document.querySelector('#login-panel').classList.add('hidden');
        document.querySelector('#editor-panel').classList.remove('hidden');
        setStatus('Signed in.');
    } catch (error) { setStatus(error.message, true); }
});

document.querySelector('#post-form').addEventListener('submit', async event => {
    event.preventDefault(); setStatus('Saving...');
    const form = new FormData(event.target);
    
    // Parse tags into array
    const rawTags = form.get('tags') || '';
    const tagsArray = rawTags.split(',').map(t => t.trim()).filter(t => t.length > 0);

    try {
        await send('/posts', { 
            title: form.get('title'), 
            body: form.get('body'), 
            url: form.get('url'),
            tags: tagsArray,
            original_date: form.get('original_date') // Include original date
        }, sessionToken);
        
        event.target.reset(); 
        bodyEditor.value(''); // Clear markdown editor
        document.getElementById('edit-select').value = ''; // Reset dropdown
        document.getElementById('original_date').value = ''; // Clear hidden ID
        platformPreview.textContent = ''; 
        setStatus('Saved. GitHub Actions will publish it shortly.');
        loadData(); // Refresh dropdown and tags
    } catch (error) { setStatus(error.message, true); }
});
</script>
</body>
</html>
