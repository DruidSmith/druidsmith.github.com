<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Post editor | David G. Smith</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
<style>body { background: #f7f5f0; } .serif { font-family: Georgia, serif; }</style>
</head>
<body class="min-h-screen text-slate-900">
<main class="mx-auto max-w-3xl px-5 py-12 sm:py-20">
    <header class="mb-10">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-amber-700">Private editor</p>
        <h1 class="serif text-4xl font-medium">Add or Edit a thought</h1>
        <p class="mt-3 max-w-xl text-slate-600">Sign in through the configured private endpoint to save a post to the site.</p>
    </header>

    <section id="login-panel" class="rounded border border-slate-200 bg-white p-6 shadow-sm">
        <form id="login-form" class="space-y-5">
            <label class="block text-sm font-medium" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded border border-slate-300 px-3 py-3 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
            <button class="rounded bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700" type="submit">Sign in</button>
        </form>
    </section>

    <section id="editor-panel" class="hidden rounded border border-slate-200 bg-white p-6 shadow-sm">
        <div class="mb-8 p-5 bg-slate-50 border border-slate-200 rounded">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
                <label class="block flex-1 text-sm font-medium" for="post-search">Find an existing post
                    <input id="post-search" type="search" placeholder="Search titles and text..." class="mt-2 w-full rounded border border-slate-300 px-3 py-2 bg-white outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
                </label>
                <label class="block text-sm font-medium" for="post-topic">Topic
                    <select id="post-topic" class="mt-2 w-full rounded border border-slate-300 px-3 py-2 bg-white outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
                        <option value="">All topics</option>
                    </select>
                </label>
                <label class="block text-sm font-medium" for="post-month">Date
                    <select id="post-month" class="mt-2 w-full rounded border border-slate-300 px-3 py-2 bg-white outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
                        <option value="">All dates</option>
                    </select>
                </label>
            </div>
            <div class="mt-4 flex items-center justify-between gap-3">
                <p id="post-count" class="text-xs text-slate-500"></p>
                <button id="new-post-btn" type="button" class="rounded bg-slate-900 px-4 py-2 text-xs font-semibold text-white hover:bg-slate-700">New post</button>
            </div>
            <div id="post-picker" class="mt-3 max-h-64 space-y-1 overflow-y-auto" aria-live="polite"></div>
        </div>

        <form id="post-form" class="space-y-5">
            <label class="block text-sm font-medium" for="title">Title<input id="title" name="title" required maxlength="200" class="mt-2 w-full rounded border border-slate-300 px-3 py-3 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100"></label>
            <input type="hidden" id="original_date" name="original_date" value="">
            
            <label class="block text-sm font-medium">
                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="post-type-tech" checked class="h-4 w-4 rounded border-slate-300 text-amber-700 focus:ring-amber-700 focus:ring-2">
                    <span>Classify as Technical Article (TechArticle schema)</span>
                </div>
            </label>

            <!-- Interactive Tagging Section -->
            <div>
                <label class="block text-sm font-medium mb-2">Tags</label>
                <div id="tag-badges" class="flex flex-wrap gap-2 mb-3"></div>
                <div class="flex gap-2">
                    <input type="text" id="new-tag-input" placeholder="Create a new tag..." class="w-full rounded border border-slate-300 px-3 py-2 text-sm outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
                    <button type="button" id="add-tag-btn" class="rounded bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-300 transition-colors">Add Tag</button>
                </div>
            </div>

            <label class="block text-sm font-medium mt-5" for="body">Post body</label>
            <textarea id="body" name="body" rows="12"></textarea>
            <p class="text-xs text-slate-500">Write in Markdown. Use the preview button in the toolbar to format before saving.</p>

            <!-- Image Library Section -->
            <section class="rounded border border-slate-200 bg-slate-50 p-4" aria-labelledby="image-library-heading">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                        <h2 id="image-library-heading" class="text-sm font-semibold">Images</h2>
                        <p class="mt-1 text-xs text-slate-500">Upload an image or click one below to insert Markdown.</p>
                    </div>
                    <label class="text-xs font-medium" for="image-file">Choose image
                        <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" class="mt-1 block max-w-full text-xs">
                    </label>
                    <button id="upload-image-btn" type="button" class="rounded bg-amber-700 px-4 py-2 text-xs font-semibold text-white hover:bg-amber-800">Upload image</button>
                </div>

                <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input id="image-search" type="search" placeholder="Filter image library..." class="w-full rounded border border-slate-300 px-3 py-2 text-xs outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
                    <input id="image-alt-input" type="text" placeholder="Custom Alt text (optional before clicking image)..." class="w-full rounded border border-slate-300 px-3 py-2 text-xs outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
                </div>

                <div id="image-library" class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>
                <textarea id="image-markdown" readonly rows="2" placeholder="Inserted Markdown code..." class="mt-3 hidden w-full rounded border border-slate-300 bg-white px-3 py-2 text-xs"></textarea>
            </section>
            
            <label class="block text-sm font-medium mt-5" for="url">Original post URL (Optional)
                <input id="url" name="url" type="url" placeholder="https://www.linkedin.com/..." class="mt-2 w-full rounded border border-slate-300 px-3 py-3 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-100">
            </label>
            <p id="platform-preview" class="text-sm text-slate-500"></p>
            
            <button class="rounded bg-amber-700 px-5 py-3 text-sm font-semibold text-white hover:bg-amber-800" type="submit">Save post</button>
        </form>
    </section>
    <p id="status" role="status" class="mt-5 text-sm text-slate-600"></p>
</main>
<script>
window.POSTING_CONFIG = { endpoint: 'https://page-post.druidsmith.workers.dev' };
const config = window.POSTING_CONFIG || { endpoint: '' };
let sessionToken = '';

let allPosts = []; 
let allTags = new Set();
let selectedTags = new Set();
let allImages = [];

const status = document.querySelector('#status');
const platformPreview = document.querySelector('#platform-preview');
const bodyEditor = new EasyMDE({
    element: document.querySelector('#body'),
    autofocus: false,
    spellChecker: false,
    status: false,
    toolbar: ['bold', 'italic', 'heading', '|', 'quote', 'unordered-list', 'ordered-list', '|', 'link', 'preview', 'side-by-side', 'fullscreen']
});

function setStatus(message, isError = false) {
    status.textContent = message;
    status.className = `mt-5 text-sm font-medium ${isError ? 'text-red-700' : 'text-slate-600'}`;
}

function renderTags() {
    const container = document.getElementById('tag-badges');
    container.innerHTML = '';
    
    Array.from(allTags).sort().forEach(tag => {
        const isSelected = selectedTags.has(tag);
        const badge = document.createElement('button');
        badge.type = 'button';
        badge.textContent = tag;
        badge.className = isSelected 
            ? 'px-3 py-1 rounded-full text-xs font-medium bg-amber-700 text-white hover:bg-amber-800 transition-colors'
            : 'px-3 py-1 rounded-full text-xs font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 transition-colors';
        
        badge.addEventListener('click', () => {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
            } else {
                selectedTags.add(tag);
            }
            renderTags();
        });
        container.appendChild(badge);
    });
}

document.getElementById('add-tag-btn').addEventListener('click', () => {
    const input = document.getElementById('new-tag-input');
    const val = input.value.trim();
    if (val) {
        allTags.add(val);
        selectedTags.add(val);
        input.value = '';
        renderTags();
    }
});

document.getElementById('new-tag-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('add-tag-btn').click();
    }
});

function formatMonth(date) {
    const parsed = new Date(date);
    return Number.isNaN(parsed.getTime()) ? '' : `${parsed.getUTCFullYear()}-${String(parsed.getUTCMonth() + 1).padStart(2, '0')}`;
}

function renderPostPicker() {
    const query = document.getElementById('post-search').value.trim().toLowerCase();
    const topic = document.getElementById('post-topic').value;
    const month = document.getElementById('post-month').value;
    const matches = allPosts.filter(post => {
        const haystack = `${post.title || ''} ${post.body || ''}`.toLowerCase();
        return (!query || haystack.includes(query)) && (!topic || (post.tags || []).includes(topic)) && (!month || formatMonth(post.date) === month);
    });
    const picker = document.getElementById('post-picker');
    picker.innerHTML = '';
    document.getElementById('post-count').textContent = `${matches.length} matching post${matches.length === 1 ? '' : 's'}`;
    matches.forEach(post => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'block w-full rounded border border-slate-200 bg-white px-3 py-2 text-left hover:border-amber-600 hover:bg-amber-50';
        button.innerHTML = `<span class="block text-sm font-medium">${escapeHtml(post.title || 'Untitled')}</span><span class="block text-xs text-slate-500">${new Date(post.date).toLocaleDateString()}${post.tags?.length ? ` · ${escapeHtml(post.tags.join(', '))}` : ''}</span>`;
        button.addEventListener('click', () => selectPost(post.date));
        picker.appendChild(button);
    });
}

function escapeHtml(value) {
    const element = document.createElement('span');
    element.textContent = value;
    return element.innerHTML;
}

function populatePostFilters() {
    const topicSelect = document.getElementById('post-topic');
    const monthSelect = document.getElementById('post-month');
    topicSelect.innerHTML = '<option value="">All topics</option>';
    monthSelect.innerHTML = '<option value="">All dates</option>';
    Array.from(allTags).sort((a, b) => a.localeCompare(b)).forEach(tag => topicSelect.add(new Option(tag, tag)));
    [...new Set(allPosts.map(post => formatMonth(post.date)).filter(Boolean))].sort().reverse().forEach(month => {
        const [year, monthNumber] = month.split('-');
        monthSelect.add(new Option(`${new Date(Date.UTC(Number(year), Number(monthNumber) - 1)).toLocaleString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' })}`, month));
    });
}

async function loadData() {
    try {
        const response = await fetch(`${config.endpoint.replace(/\/$/, '')}/posts`);
        if(response.ok) {
            let fetchedPosts = await response.json();
            allPosts = fetchedPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
            allPosts.forEach(p => {
                if (p.tags && Array.isArray(p.tags)) {
                    p.tags.forEach(t => allTags.add(t));
                }
            });
            populatePostFilters();
            renderPostPicker();
            renderTags();
        }
    } catch (e) {
        console.warn('Could not load posts', e);
    }
}
loadData();
loadImages();

function selectPost(date) {
    const form = document.getElementById('post-form');
    
    if (!date) {
        form.reset();
        bodyEditor.value('');
        document.getElementById('original_date').value = '';
        document.getElementById('post-type-tech').checked = true; // Default to Technical Article
        platformPreview.textContent = '';
        selectedTags.clear();
        renderTags();
        return;
    }
    
    const post = allPosts.find(p => p.date === date);
    if (post) {
        document.getElementById('title').value = post.title || '';
        document.getElementById('url').value = post.url || '';
        document.getElementById('original_date').value = post.date;
        document.getElementById('post-type-tech').checked = (post.type === 'TechArticle') || (!post.type);
        bodyEditor.value(post.body || '');

        selectedTags.clear();
        if (post.tags) {
            post.tags.forEach(t => selectedTags.add(t));
        }
        renderTags();

        const platform = platformFromUrl(post.url);
        platformPreview.textContent = platform ? `Platform detected: ${platform}` : '';
        window.scrollTo({ top: form.offsetTop - 50, behavior: 'smooth' });
    }
}

['post-search', 'post-topic', 'post-month'].forEach(id => document.getElementById(id).addEventListener('input', renderPostPicker));
document.getElementById('new-post-btn').addEventListener('click', () => selectPost(''));

async function loadImages() {
    try {
        const response = await fetch(`${config.endpoint.replace(/\/$/, '')}/images`);
        if (!response.ok) throw new Error('Could not load image library.');
        allImages = await response.json();
        renderImages();
    } catch (error) { setStatus(error.message, true); }
}

function renderImages() {
    const query = document.getElementById('image-search').value.trim().toLowerCase();
    const library = document.getElementById('image-library');
    library.innerHTML = '';
    
    allImages.filter(image => image.name.toLowerCase().includes(query)).forEach(image => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'overflow-hidden rounded border border-slate-200 bg-white text-left hover:border-amber-600 transition group';
        
        // Cascading fallback: local session blob > raw GitHub file > production URL
        const imgSrc = image.previewUrl || image.raw_url || image.url;
        
        button.innerHTML = `
            <img src="${imgSrc}" alt="${escapeHtml(image.name)}" loading="lazy" class="aspect-square w-full object-cover">
            <span class="block truncate px-2 py-1 text-[11px] text-slate-700 group-hover:text-amber-800">${escapeHtml(image.name)}</span>
        `;
        
        button.addEventListener('click', () => {
            const fallbackAlt = image.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
            const altInput = document.getElementById('image-alt-input');
            let chosenAlt = altInput.value.trim();

            if (!chosenAlt) {
                const promptVal = prompt('Enter Alt text for this image (recommended for SEO & accessibility):', fallbackAlt);
                chosenAlt = promptVal !== null && promptVal.trim() !== '' ? promptVal.trim() : fallbackAlt;
            }

            // Always write the final production URL to Markdown
            const markdown = `![${chosenAlt}](${image.url})`;
            bodyEditor.codemirror.replaceSelection(markdown);
            
            const output = document.getElementById('image-markdown');
            output.value = markdown;
            output.classList.remove('hidden');
            altInput.value = '';
        });
        library.appendChild(button);
    });
}

document.getElementById('image-search').addEventListener('input', renderImages);

document.getElementById('upload-image-btn').addEventListener('click', async () => {
    const file = document.getElementById('image-file').files[0];
    if (!file) { setStatus('Choose an image first.', true); return; }
    if (file.size > 10 * 1024 * 1024) { setStatus('Image must be smaller than 10 MB.', true); return; }
    
    // Create an immediate local preview URL to bypass the GitHub Actions deployment delay
    const localPreviewUrl = URL.createObjectURL(file);
    
    setStatus('Uploading image to GitHub repository...');
    try {
        const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
        
        const result = await send('/images', { name: file.name, type: file.type, data }, sessionToken);
        
        allImages.unshift({ name: result.name, url: result.url, previewUrl: localPreviewUrl });
        renderImages();
        
        const fallbackAlt = result.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
        const altInput = document.getElementById('image-alt-input');
        const chosenAlt = altInput.value.trim() || fallbackAlt;
        const markdown = `![${chosenAlt}](${result.url})`;
        
        bodyEditor.codemirror.replaceSelection(markdown);
        document.getElementById('image-markdown').value = markdown;
        document.getElementById('image-markdown').classList.remove('hidden');
        document.getElementById('image-file').value = '';
        altInput.value = '';
        
        setStatus('Image uploaded and inserted to editor.');

    } catch (error) { setStatus(error.message, true); }
});

function platformFromUrl(value) {
    try {
        const host = new URL(value).hostname.replace(/^www\./, '');
        if (host.includes('linkedin')) return 'LinkedIn';
        if (host === 'x.com' || host === 'twitter.com') return 'X / Twitter';
        return ['facebook', 'instagram', 'youtube', 'tiktok', 'threads', 'medium', 'github'].find(name => host.includes(name)) || 'Other';
    } catch { return ''; }
}

document.querySelector('#url').addEventListener('input', event => {
    const platform = platformFromUrl(event.target.value);
    platformPreview.textContent = platform ? `Platform detected: ${platform}` : '';
});

async function send(path, payload, token = '') {
    if (!config.endpoint) throw new Error('POSTING_CONFIG.endpoint is not configured.');
    const response = await fetch(`${config.endpoint.replace(/\/$/, '')}${path}`, {
        method: 'POST', 
        headers: { 
            'Content-Type': 'application/json', 
            ...(token ? { Authorization: `Bearer ${token}` } : {}) 
        }, 
        body: JSON.stringify(payload)
    });
    
    if (response.status === 401) {
        document.querySelector('#login-panel').classList.remove('hidden');
        document.querySelector('#editor-panel').classList.add('hidden');
        throw new Error('Your session expired. Please sign in again.');
    }
    
    if (!response.ok) {
        let errMsg = 'Request failed.';
        try {
            const errJson = await response.json();
            errMsg = errJson.detail ? `${errJson.error} — ${errJson.detail}` : (errJson.error || errMsg);
        } catch {
            errMsg = (await response.text()) || errMsg;
        }
        throw new Error(errMsg);
    }
    return response.json();
}

document.querySelector('#login-form').addEventListener('submit', async event => {
    event.preventDefault(); 
    setStatus('Signing in...');
    try {
        const result = await send('/login', { password: document.querySelector('#password').value });
        sessionToken = result.token;
        document.querySelector('#login-panel').classList.add('hidden');
        document.querySelector('#editor-panel').classList.remove('hidden');
        setStatus('Signed in.');
    } catch (error) { setStatus(error.message, true); }
});

document.querySelector('#post-form').addEventListener('submit', async event => {
    event.preventDefault(); 
    setStatus('Saving post to GitHub...');
    
    const titleVal = document.getElementById('title').value.trim();
    const bodyVal = bodyEditor.value().trim();
    const urlVal = document.getElementById('url').value.trim();
    const originalDateVal = document.getElementById('original_date').value;
    const typeVal = document.getElementById('post-type-tech').checked ? 'TechArticle' : 'BlogPosting';
    const tagsArray = Array.from(selectedTags);

    if (!titleVal || !bodyVal) {
        setStatus('Title and body are required.', true);
        return;
    }

    try {
        await send('/posts', { 
            title: titleVal, 
            body: bodyVal, 
            url: urlVal,
            tags: tagsArray,
            type: typeVal,
            original_date: originalDateVal 
        }, sessionToken);
        
        selectPost('');
        setStatus('Post saved! GitHub Actions will build and publish it shortly.');
        loadData();
    } catch (error) { setStatus(error.message, true); }
});
</script>
</body>
</html>
