- name: Commit and Push Changes
        id: publish
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage everything generated or modified by python build_thoughts.py
          git add -A
          
          if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          
          git commit -m "Auto-generate thoughts, tag aggregators, and month pages"
          
          # Pull and rebase safely now that all files are staged
          git pull --rebase -X theirs origin master
          
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Submit updated page to Bing IndexNow
        if: steps.publish.outputs.changed == 'true' && env.INDEXNOW_KEY != ''
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "{\"host\":\"davidgsmith.net\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://davidgsmith.net/$INDEXNOW_KEY.txt\",\"urlList\":[\"https://davidgsmith.net/thoughts.html\",\"https://davidgsmith.net/rss.xml\"]}"
