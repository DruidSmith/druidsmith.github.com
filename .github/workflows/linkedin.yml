name: Build Stored Thoughts

on:
  push:
    paths:
      - 'posts.json'
      - 'build_thoughts.py'
      - '.github/workflows/linkedin.yml'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Allows the action to commit files back to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build thoughts page
        run: python build_thoughts.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add thoughts2.html
          git commit -m "Build stored thoughts page" || exit 0
          git push